services:
  - type: web
    name: postman-bridge
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node --import tsx src/server.ts
    healthCheckPath: /v1/models
    envVars:
      - BRIDGE_API_KEY: {"default":"sk-postman-local"}
      - POSTMAN_HEADLESS: "true"
      - BRIDGE_KEEPALIVE: "true"
      - NODE_ENV: production
      - BRIDGE_HOST: 0.0.0.0
      - BRIDGE_PORT: "10000"
